<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS Phase 4.3 Analytics Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f9fafb; --text-primary: #1f2937; --text-secondary: #6b7280;
      --border-color: #e5e7eb; --agent-1: #2563eb; --agent-2: #dc2626; --agent-3: #16a34a;
      --status-active: #10b981; --status-warning: #f59e0b; --status-critical: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1f2937; --bg-secondary: #111827; --text-primary: #f3f4f6; --text-secondary: #d1d5db; --border-color: #374151;
      }
    }
    html[data-theme="dark"] {
      --bg-primary: #1f2937; --bg-secondary: #111827; --text-primary: #f3f4f6; --text-secondary: #d1d5db; --border-color: #374151;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
      padding-bottom: 20px; border-bottom: 2px solid var(--border-color);
    }
    h1 { font-size: 28px; font-weight: 700; }
    .header-controls { display: flex; gap: 15px; align-items: center; }
    .theme-toggle {
      background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-primary); transition: all 0.2s;
    }
    .theme-toggle:hover { background: var(--border-color); }
    .status-badge {
      padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    }
    .status-active { background: rgba(16, 185, 129, 0.1); color: var(--status-active); }
    .status-critical { background: rgba(239, 68, 68, 0.1); color: var(--status-critical); }
    .agent-health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .agent-card {
      background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: 8px; padding: 20px; transition: all 0.3s;
    }
    .agent-card:hover { border-color: var(--text-secondary); }
    .agent-header { display: flex; align-items: center; margin-bottom: 15px; gap: 10px; }
    .agent-name { font-size: 16px; font-weight: 600; }
    .agent-color-dot { width: 12px; height: 12px; border-radius: 50%; }
    .agent-1 { background: var(--agent-1); }
    .agent-2 { background: var(--agent-2); }
    .agent-3 { background: var(--agent-3); }
    .agent-info { font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
    .agent-info-row { display: flex; justify-content: space-between; padding: 6px 0; }
    .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .chart-box { background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: 8px; padding: 20px; }
    .chart-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; }
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .insight-card { background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: 8px; padding: 20px; }
    .insight-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary); }
    .insight-value { font-size: 18px; font-weight: 700; padding: 10px; border-radius: 4px; text-align: center; }
    .insight-positive { background: rgba(16, 185, 129, 0.1); color: var(--status-active); }
    .insight-negative { background: rgba(245, 158, 11, 0.1); color: var(--status-warning); }
    .error-message { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--status-critical); color: var(--status-critical); padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; padding-top: 20px; border-top: 2px solid var(--border-color); }
    .section-title:first-child { border-top: none; padding-top: 0; }
    canvas { max-height: 300px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏛️ ATLAS Phase 4.3 Analytics</h1>
      <div class="header-controls">
        <div class="status-badge status-active" id="serverStatus">● CONNECTING</div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
      </div>
    </header>
    <div id="errorMessage"></div>
    <h2 class="section-title">Agent Health</h2>
    <div class="agent-health-grid" id="agentGrid"></div>
    <h2 class="section-title">Orchestration Metrics</h2>
    <div class="charts-container">
      <div class="chart-box">
        <div class="chart-title">Cycles & Performance</div>
        <canvas id="metricsChart"></canvas>
      </div>
    </div>
    <h2 class="section-title">Cross-Agent Insights</h2>
    <div class="insights-grid" id="insightsGrid"></div>
  </div>
  <script>
    const API_URL = 'http://localhost:3001';
    let metricsChart = null;
    const agents = [
      { id: 'thailand-property', name: 'Thailand Property Agent', class: 'agent-1' },
      { id: 'marketing', name: 'BonusShop Marketing Agent', class: 'agent-2' },
      { id: 'trading', name: 'Trading & Investment Agent', class: 'agent-3' }
    ];
    async function fetchData() {
      try {
        const response = await fetch(`${API_URL}/api/orchestrator/status`);
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        document.getElementById('serverStatus').textContent = '✓ CONNECTED';
        document.getElementById('serverStatus').classList.remove('status-critical');
        document.getElementById('serverStatus').classList.add('status-active');
        document.getElementById('errorMessage').innerHTML = '';
        updateAgentCards(data);
        updateCharts(data);
        updateInsights(data);
        await fetch(`${API_URL}/api/orchestrator/cycle`, { method: 'POST' });
      } catch (error) {
        document.getElementById('serverStatus').textContent = '✗ OFFLINE';
        document.getElementById('serverStatus').classList.remove('status-active');
        document.getElementById('serverStatus').classList.add('status-critical');
        document.getElementById('errorMessage').innerHTML = `<div class="error-message">Cannot connect to API at ${API_URL}. Make sure Express server is running on port 3001.</div>`;
      }
    }
    function updateAgentCards(data) {
      const grid = document.getElementById('agentGrid');
      grid.innerHTML = agents.map(agent => {
        const agentData = data.agents[agent.id] || { status: 'unknown', lastActivity: 'N/A', cycles: 0 };
        const statusClass = agentData.status === 'active' ? 'status-active' : 'status-warning';
        return `<div class="agent-card"><div class="agent-header"><div class="agent-color-dot ${agent.class}"></div><div class="agent-name">${agent.name}</div></div><div class="agent-info"><div class="agent-info-row"><span>Status:</span><span class="status-badge ${statusClass}">${agentData.status}</span></div><div class="agent-info-row"><span>Last Activity:</span><span>${agentData.lastActivity}</span></div><div class="agent-info-row"><span>Cycles:</span><span>${agentData.cycles}</span></div></div></div>`;
      }).join('');
    }
    function updateCharts(data) {
      const ctx = document.getElementById('metricsChart').getContext('2d');
      if (metricsChart) metricsChart.destroy();
      metricsChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Total Cycles', 'Avg Duration (ms)', 'Active Agents'],
          datasets: [{
            label: 'Orchestration Metrics',
            data: [data.totalCycles || 0, data.avgDuration || 0, data.activeAgents || 0],
            backgroundColor: ['rgba(37, 99, 235, 0.8)', 'rgba(220, 38, 38, 0.8)', 'rgba(22, 163, 74, 0.8)'],
            borderColor: ['rgb(37, 99, 235)', 'rgb(220, 38, 38)', 'rgb(22, 163, 74)'],
            borderWidth: 2,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, grid: { color: 'rgba(0, 0, 0, 0.05)' } } }
        }
      });
    }
    function updateInsights(data) {
      const insights = [
        { title: 'Property ROI Ready', value: (data.agents?.['thailand-property']?.score || 0) > 7.5 ? '✓ Yes' : '○ No', positive: (data.agents?.['thailand-property']?.score || 0) > 7.5 },
        { title: 'Marketing Budget Converged', value: (data.agents?.['marketing']?.convergence || 0) > 30 ? '✓ Yes' : '○ No', positive: (data.agents?.['marketing']?.convergence || 0) > 30 },
        { title: 'Portfolio Balanced', value: (data.agents?.['trading']?.concentration || 100) < 40 ? '✓ Yes' : '○ No', positive: (data.agents?.['trading']?.concentration || 100) < 40 }
      ];
      document.getElementById('insightsGrid').innerHTML = insights.map(insight => `<div class="insight-card"><div class="insight-title">${insight.title}</div><div class="insight-value ${insight.positive ? 'insight-positive' : 'insight-negative'}">${insight.value}</div></div>`).join('');
    }
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      document.querySelector('.theme-toggle').textContent = isDark ? '🌙 Dark' : '☀️ Light';
    }
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.querySelector('.theme-toggle').textContent = savedTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
